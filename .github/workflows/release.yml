name: Draft desktop release

on:
  push:
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  workflow-check:
    name: 发布工作流配置检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 校验版本和仓库完整性
        run: python scripts/check_repo.py

  package-macos:
    name: macOS ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 确认 tag 版本与应用版本一致
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import json, sys, tomllib
          version = sys.argv[1]
          with open("package.json", encoding="utf-8") as f:
              package = json.load(f)["version"]
          with open("src-tauri/tauri.conf.json", encoding="utf-8") as f:
              app = json.load(f)["version"]
          with open("src-tauri/Cargo.toml", "rb") as f:
              cargo = tomllib.load(f)["package"]["version"]
          if {version, package, app, cargo} != {version}:
              raise SystemExit(f"tag={version}, package={package}, tauri={app}, cargo={cargo}")
          PY
      - name: 运行仓库自检与 Rust 单测
        run: |
          python3 scripts/check_repo.py
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: 安装前端依赖
        run: npm ci
      - name: 构建未签名 ${{ matrix.arch }} Mac App 与 DMG
        run: npm run build -- --target ${{ matrix.target }}
      - name: 验证未签名 DMG 镜像完整性
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [[ "${#dmg_files[@]}" -ne 1 ]]; then
            echo "::error::应生成恰好一个 DMG，实际数量: ${#dmg_files[@]}"
            exit 1
          fi
          hdiutil verify "${dmg_files[0]}"
      - name: 生成安装包与 SHA-256
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          files=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#files[@]}" -eq 1
          name="Screenguard_${GITHUB_REF_NAME#v}_${{ matrix.arch }}.dmg"
          cp "${files[0]}" "release-assets/$name"
          shasum -a 256 "release-assets/$name" > "release-assets/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Windows x64 NSIS installer
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 确认 tag 版本与应用版本一致
        shell: bash
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          expected = os.environ["TAG_VERSION"]
          if not expected.startswith("v"):
              raise SystemExit(f"release tag must start with v: {expected}")
          expected = expected[1:]
          package = json.loads(Path("package.json").read_text())["version"]
          tauri = json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"]
          with Path("src-tauri/Cargo.toml").open("rb") as f:
              cargo = tomllib.load(f)["package"]["version"]
          if any(value != expected for value in (package, tauri, cargo)):
              raise SystemExit(f"tag={expected}, package={package}, tauri={tauri}, cargo={cargo}")
          PY
      - name: 仓库自检、C# 桥接检查与 Rust 单测
        run: |
          python scripts/check_repo.py
          python scripts/check_cs.py
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: 安装前端依赖
        run: npm ci
      - name: 构建 Windows x64 安装包
        run: npm run build:win
      - name: 静默安装与卸载 NSIS 包烟雾检查
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS 安装包不存在" }
          ./scripts/smoke_windows_installer.ps1 -InstallerPath $installer.FullName
      - name: 生成安装包与 SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($files.Count -ne 1) { throw "Expected one NSIS installer, found $($files.Count)" }
          $name = "Screenguard_$($env:GITHUB_REF_NAME.TrimStart('v'))_x64-setup.exe"
          $dest = Join-Path release-assets $name
          Copy-Item $files[0].FullName $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii "$dest.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  create-draft-release:
    name: Create or update GitHub draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: [package-macos, package-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 只允许发布已合入 main 的 tag
        env:
          TAG_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: 汇总 SHA-256
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
      - name: 创建或更新草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(mktemp)
          cat > "$notes" <<'NOTES'
          本草稿仅在 tag 已合入 main 且 macOS 与 Windows 安装包构建完成后生成。

          附件包含 Apple Silicon 与 Intel macOS DMG、Windows x64 NSIS 安装包及 SHA-256 校验文件。

          不使用 Apple Developer ID 或 Windows Authenticode 证书，也不提交 Apple 公证。macOS 首次打开可能需要用户在系统安全提示中手动允许；Windows 可能显示未知发布者/SmartScreen 提示。发布前仍需人工确认双平台真实设备验收、安装升级卸载和回滚路径；Draft 不代表公开发行或实机验收完成。
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --draft --title "Screenguard $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" release-assets/* --draft --verify-tag --title "Screenguard $TAG" --notes-file "$notes"
          fi
