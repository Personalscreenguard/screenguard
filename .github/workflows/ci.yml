name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-check:
    name: 仓库自检（版本 / JSON / JS 语法）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check_repo（版本一致性 / bundle 引用 / JS 语法 / C# 单引号）
        run: python scripts/check_repo.py

  rust-check:
    name: cargo check（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 系统依赖（Tauri 官方清单）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --locked
      - name: 内嵌 C# 桥接编译检查（仅 Windows）
        if: runner.os == 'Windows'
        working-directory: .
        run: python scripts/check_cs.py
