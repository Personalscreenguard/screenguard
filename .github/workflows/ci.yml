name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-check:
    name: 仓库自检（版本 / JSON / JS 语法）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: check_repo（版本一致性 / bundle 引用 / JS 语法 / C# 单引号）
        run: python scripts/check_repo.py

  rust-check:
    name: cargo check（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
      - name: 安装 Linux 系统依赖（Tauri 官方清单）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --locked
      - name: cargo test
        run: cargo test --locked
      - name: 内嵌 C# 桥接编译检查（仅 Windows）
        if: runner.os == 'Windows'
        working-directory: .
        run: python scripts/check_cs.py

  package-macos:
    name: macOS DMG 构建
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装前端依赖
        run: npm ci
      - name: 构建 macOS App 与 DMG
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: screenguard-macos-${{ matrix.arch }}-${{ github.sha }}
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: Windows NSIS 安装包构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 验证 Windows 签名脚本语法
        shell: pwsh
        working-directory: .
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/sign_windows_installer.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Windows 签名脚本语法无效"
          }
      - name: 安装前端依赖
        run: npm ci
      - name: 构建 Windows NSIS 安装包
        run: npm run build:win
      - name: 确认离线 WebView2 运行时已打入安装包
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "预期一个 NSIS 安装包，实际数量: $($installers.Count)" }
          $size = (Get-Item $installers[0].FullName).Length
          $minimum = [long](100MB)
          if ($size -lt $minimum) {
            throw "NSIS 包只有 $size bytes；低于 100 MiB，疑似未嵌入 WebView2 离线运行时"
          }
          Write-Host "NSIS 包大小 $size bytes；已满足离线 WebView2 运行时体积门槛。"
      - name: 静默安装与卸载 NSIS 包烟雾检查
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS 安装包不存在" }
          ./scripts/smoke_windows_installer.ps1 -InstallerPath $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: screenguard-windows-${{ github.sha }}
          path: src-tauri/target/**/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
