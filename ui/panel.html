<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>屏幕守护</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: rgba(28,32,42,0.93);
    --bg2: rgba(255,255,255,0.05);
    --bg3: rgba(255,255,255,0.10);
    --border: rgba(255,255,255,0.10);
    --text: #eef1f6; --dim: #a8b0bf; --accent: #4f8cff; --accent2: #7fb0ff;
  }
  html, body { background: transparent; }
  body { font-family:-apple-system,"PingFang SC","Segoe UI",Roboto,sans-serif; color:var(--text); font-size:12.5px; -webkit-font-smoothing:antialiased; user-select:none; overflow:hidden; }
  .card {
    background: linear-gradient(180deg, #242a38 0%, #1a1e2b 100%);
    border:1px solid var(--border); border-radius:16px; height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .head { display:flex; justify-content:space-between; align-items:center; padding:10px 13px; border-bottom:1px solid var(--border); background:rgba(0,0,0,0.14); }
  .head .t { font-weight:700; font-size:13.5px; } .head .t span { color:var(--accent2); }
  .btns { display:flex; gap:6px; }
  .ibtn { background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:11.5px; transition:.15s; }
  .ibtn:hover { background:var(--bg3); }
  .scroll { flex:1; overflow-y:auto; padding:6px 8px 8px; } .scroll::-webkit-scrollbar{width:6px} .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:6px}

  .sec-label { padding:8px 10px 4px; font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
  .grp { border:1px solid var(--border); border-radius:12px; margin:4px 0; background:rgba(255,255,255,0.03); overflow:hidden; }
  .grp.open .grp-body { display:block; }
  .grp-body { display:none; padding:2px 12px 10px; }
  .grp-h { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; }
  .grp-title { font-weight:650; } .grp-meta { font-size:10.5px; color:var(--dim); margin-top:1px; }
  .grp-right { display:flex; align-items:center; gap:8px; }
  .badge { font-size:10px; background:rgba(79,140,255,.15); color:var(--accent2); border:1px solid rgba(79,140,255,.25); padding:2px 7px; border-radius:10px; }

  .srow { display:grid; grid-template-columns:52px 1fr 40px; align-items:center; gap:10px; padding:5px 0; }
  .srow label { color:var(--dim); font-size:11.5px; }
  .hint { color:var(--dim); font-size:11px; padding:6px 0; line-height:1.5; }
  .ver { font-size:10px; color:var(--dim); font-weight:400; margin-left:6px; letter-spacing:.3px; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:5px; border-radius:5px; background:rgba(255,255,255,.16); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--accent); cursor:pointer; border:none; box-shadow:0 0 0 3px rgba(79,140,255,.25); }
  .srow .val { text-align:right; font-variant-numeric:tabular-nums; font-size:11.5px; }

  /* 快捷操作栅格 */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:2px 8px 6px; }
  .cell { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:8px 6px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; transition:.15s; text-align:center; }
  .cell:hover { background:var(--bg3); }
  .cell .ico { font-size:16px; line-height:1; }
  .cell .lbl { font-size:10.5px; color:var(--text); }
  .cell.active { background:linear-gradient(135deg,#3f7bf0,#2f6ae0); border-color:transparent; }
  .cell.active .lbl { color:#fff; }
  .span2 { grid-column: span 3; flex-direction:row; justify-content:center; gap:8px; }

  .foot { display:flex; gap:8px; padding:8px; border-top:1px solid var(--border); }
  .fbtn { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; background:var(--bg2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:9px 0; cursor:pointer; font-size:12.5px; }
  .fbtn:hover { background:var(--bg3); }
  .empty { color:var(--dim); text-align:center; padding:14px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="t">🖥️ <span>屏幕守护</span><span class="ver" id="pver"></span></div>
    <div class="btns"><button class="ibtn" id="main-btn">主窗口</button><button class="ibtn" id="quit-btn">退出</button></div>
  </div>

  <div class="sec-label">显示器</div>
  <div class="scroll" id="scroll" style="flex:0 0 auto"><div class="empty">读取显示器…</div></div>

  <div class="sec-label">快捷控制</div>
  <div class="grid" id="quick">
    <div class="cell" data-act="color-srgb"><span class="ico">🎨</span><span class="lbl">sRGB</span></div>
    <div class="cell" data-act="color-p3"><span class="ico">🌈</span><span class="lbl">P3</span></div>
    <div class="cell" data-act="color-adobe"><span class="ico">🖼️</span><span class="lbl">AdobeRGB</span></div>
    <div class="cell" data-act="align-mac"><span class="ico">🍎</span><span class="lbl">对齐Mac</span></div>
    <div class="cell" data-act="ppi"><span class="ico">🪟</span><span class="lbl">窗口不变小</span></div>
    <div class="cell" data-act="rotate"><span class="ico">🔄</span><span class="lbl">横竖屏</span></div>
    <div class="cell" data-act="span"><span class="ico">🎬</span><span class="lbl">双屏铺满</span></div>
  </div>

  <div class="foot">
    <button class="fbtn" id="refresh-btn">⟳ 刷新</button>
    <button class="fbtn" id="main-btn2">🖥️ 主窗口</button>
    <button class="fbtn" id="autostart-btn">⚡ 自启：检测中</button>
  </div>
</div>

<script>
function invoke(cmd, args={}){ if(window.__TAURI__&&window.__TAURI__.core) return window.__TAURI__.core.invoke(cmd,args); return Promise.reject(new Error('NO_TAURI')); }
function flash(el){ el.classList.add('active'); setTimeout(()=>el.classList.remove('active'),300); }

// DDC 写入串行化 + 合并最新值：拖动滑块时最多只有 1 个后台进程在跑，
// 中间值被覆盖、最终值保证送达（此前每格都新起 powershell 进程，拖动即卡死）
const vpState = new Map();
function sendVCP(kind, id, val){
  const key = kind + ':' + id;
  let st = vpState.get(key);
  if (!st) { st = { latest: null, busy: false }; vpState.set(key, st); }
  st.latest = val;
  if (st.busy) return;
  st.busy = true;
  (async () => {
    while (st.latest !== null) {
      const v = st.latest; st.latest = null;
      const cmd = kind === 'brightness' ? 'set_brightness' : 'set_volume';
      try { await invoke(cmd, { displayId: id, value: Number(v) }); } catch (e) {}
    }
    st.busy = false;
  })();
}

async function load(){
  const box = document.getElementById('scroll');
  try {
    const ds = await invoke('get_displays');
    if(!ds||!ds.length){ box.innerHTML='<div class="empty">未检测到显示器</div>'; return; }
    box.innerHTML = ds.map(d=>`
      <div class="grp open">
        <div class="grp-h">
          <div><div class="grp-title">${d.name||d.id}</div><div class="grp-meta">${d.resolution||''}${d.hz?' · '+d.hz+'Hz':''}${d.main?' · 主屏':''}${d.color_profile?' · '+d.color_profile:''}</div></div>
          <div class="grp-right">${d.ddc?'<span class="badge">DDC</span>':'<span class="badge" style="background:rgba(255,160,80,.12);color:#e8a75c;border-color:rgba(255,160,80,.3)">无DDC</span>'}</div>
        </div>
        ${d.ddc ? `
        <div class="grp-body">
          <div class="srow"><label>亮度</label><input type="range" min="0" max="100" value="${d.brightness??50}" data-id="${d.id}" data-k="brightness"><span class="val">${d.brightness??50}%</span></div>
          <div class="srow"><label>音量</label><input type="range" min="0" max="100" value="${d.volume??50}" data-id="${d.id}" data-k="volume"><span class="val">${d.volume??50}%</span></div>
        </div>` : '<div class="grp-body"><div class="hint">此显示器不支持 DDC/CI，请用硬件按钮调节</div></div>'}
      </div>`).join('');
    box.querySelectorAll('input[type=range]').forEach(sl=>{
      sl.addEventListener('input', ev=>{ const v=ev.target.value; sl.parentElement.querySelector('.val').textContent=v+'%'; sendVCP(sl.dataset.k, sl.dataset.id, v); });
    });
  } catch(e){ box.innerHTML='<div class="empty">无法读取显示器：请确认显示器已连接，并检查依赖是否就绪</div>'; }
}

document.getElementById('quick').querySelectorAll('.cell').forEach(c=>{
  c.onclick = async ()=>{ flash(c); const a=c.dataset.act; try{ switch(a){
    case 'color-srgb': await invoke('apply_color_space',{space:'sRGB'}); break;
    case 'color-p3': await invoke('apply_color_space',{space:'p3'}); break;
    case 'color-adobe': await invoke('apply_color_space',{space:'adobeRGB'}); break;
    case 'align-mac': await invoke('match_mac'); break;
    case 'ppi': await invoke('match_ppi'); break;
    case 'rotate': await invoke('rotate_secondary'); break;
    case 'span': await invoke('span_video'); break;
  }}catch(e){ c.style.borderColor='#ef6a6a'; setTimeout(()=>{c.style.borderColor='';},700); } };
});
document.getElementById('refresh-btn').onclick=load;
document.getElementById('main-btn').onclick=()=>invoke('open_main');
document.getElementById('main-btn2').onclick=()=>invoke('open_main');
document.getElementById('quit-btn').onclick=()=>invoke('quit_app');

// 版本号 + 开机自启开关
const autostartBtn = document.getElementById('autostart-btn');
function paintAutostart(on){
  autostartBtn.textContent = on ? '⚡ 自启：开' : '⚡ 自启：关';
  autostartBtn.style.color = on ? '#7fb0ff' : '';
}
async function refreshAutostart(){
  try { paintAutostart(await invoke('get_autostart')); }
  catch(e){ autostartBtn.textContent='⚡ 自启：?'; }
}
autostartBtn.onclick = async ()=>{
  const want = !(autostartBtn.textContent.includes('开'));
  autostartBtn.textContent = '⚡ 设置中…';
  try {
    await invoke('set_autostart', { enabled: want });
    paintAutostart(want);
  } catch(e){
    autostartBtn.textContent = '⚡ 失败';
    autostartBtn.style.color = '#ef6a6a';
    setTimeout(()=>{ refreshAutostart(); autostartBtn.style.color=''; }, 900);
  }
};
// 注意：这是经典脚本(type 未标 module)，不能用顶层 await——否则整段脚本语法报错、
// 面板全部功能失效（刷新/自启/快捷操作/滑块都点不动）。
invoke('get_version')
  .then(v => { document.getElementById('pver').textContent = 'v' + v; })
  .catch(() => { /* 预览模式静默 */ });
load();
refreshAutostart();
</script>
</body>
</html>
