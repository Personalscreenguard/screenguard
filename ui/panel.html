<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>屏幕守护</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: rgba(28,32,42,0.93);
    --bg2: rgba(255,255,255,0.05);
    --bg3: rgba(255,255,255,0.10);
    --border: rgba(255,255,255,0.10);
    --text: #eef1f6; --dim: #a8b0bf; --accent: #4f8cff; --accent2: #7fb0ff;
  }
  html, body { background: transparent; }
  body { font-family:-apple-system,"PingFang SC","Segoe UI",Roboto,sans-serif; color:var(--text); font-size:12.5px; -webkit-font-smoothing:antialiased; user-select:none; overflow:hidden; }
  .card {
    background: linear-gradient(180deg, #242a38 0%, #1a1e2b 100%);
    border:1px solid var(--border); border-radius:16px; height:100vh; display:flex; flex-direction:column; overflow-y:auto;
  }
  .card::-webkit-scrollbar{width:6px} .card::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:6px}
  .head { display:flex; justify-content:space-between; align-items:center; padding:10px 13px; border-bottom:1px solid var(--border); background:rgba(0,0,0,0.14); position:sticky; top:0; z-index:10; }
  .head .t { font-weight:700; font-size:13.5px; } .head .t span { color:var(--accent2); }
  .btns { display:flex; gap:6px; }
  .ibtn { background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:11.5px; transition:.15s; }
  .ibtn:hover { background:var(--bg3); }
  .scroll { flex:0 0 auto; overflow:visible; padding:6px 8px 8px; }

  .sec-label { padding:8px 10px 4px; font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
  .grp { border:1px solid var(--border); border-radius:12px; margin:4px 0; background:rgba(255,255,255,0.03); overflow:hidden; }
  .grp.open .grp-body { display:block; }
  .grp-body { display:none; padding:2px 12px 10px; }
  .grp-h { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; }
  .grp-title { font-weight:650; } .grp-meta { font-size:10.5px; color:var(--dim); margin-top:1px; }
  .grp-right { display:flex; align-items:center; gap:8px; }
  .badge { font-size:10px; background:rgba(79,140,255,.15); color:var(--accent2); border:1px solid rgba(79,140,255,.25); padding:2px 7px; border-radius:10px; }

  .srow { display:grid; grid-template-columns:52px 1fr 40px; align-items:center; gap:10px; padding:5px 0; }
  .srow label { color:var(--dim); font-size:11.5px; }
  .hint { color:var(--dim); font-size:11px; padding:6px 0; line-height:1.5; }
  .ver { font-size:10px; color:var(--dim); font-weight:400; margin-left:6px; letter-spacing:.3px; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:5px; border-radius:5px; background:rgba(255,255,255,.16); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--accent); cursor:pointer; border:none; box-shadow:0 0 0 3px rgba(79,140,255,.25); }
  .srow .val { text-align:right; font-variant-numeric:tabular-nums; font-size:11.5px; }

  /* 快捷操作栅格 */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:2px 8px 6px; }
  .cell { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:8px 6px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; transition:.15s; text-align:center; }
  .cell:hover { background:var(--bg3); }
  .cell .ico { font-size:16px; line-height:1; }
  .cell .lbl { font-size:10.5px; color:var(--text); }
  .cell.active { background:linear-gradient(135deg,#3f7bf0,#2f6ae0); border-color:transparent; }
  .cell.active .lbl { color:#fff; }
  .span2 { grid-column: span 3; flex-direction:row; justify-content:center; gap:8px; }

  .foot { display:flex; gap:8px; padding:8px; border-top:1px solid var(--border); }
  .fbtn { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; background:var(--bg2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:9px 0; cursor:pointer; font-size:12.5px; }
  .fbtn:hover { background:var(--bg3); }
  .empty { color:var(--dim); text-align:center; padding:14px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="t">🖥️ <span>屏幕守护</span><span class="ver" id="pver"></span></div>
    <div class="btns"><button class="ibtn" id="hide-btn" title="隐藏面板（Esc）">✕</button><button class="ibtn" id="main-btn">主窗口</button><button class="ibtn" id="quit-btn">退出</button></div>
  </div>

  <div class="sec-label" id="audio-sec" style="display:none">系统音量</div>
  <div style="padding:0 8px">
    <div class="grp open" id="audio-grp" style="display:none">
      <div class="grp-body">
        <div class="srow"><label>音量</label><input type="range" min="0" max="100" value="0" id="sys-vol" disabled><span class="val" id="sys-vol-val">-</span></div>
        <div class="hint" id="audio-dev">读取中…</div>
      </div>
    </div>
  </div>

  <div class="sec-label" id="batt-sec" style="display:none">电池设备</div>
  <div style="padding:0 8px" id="batt-box"></div>

  <div class="sec-label">显示器</div>
  <div class="scroll" id="scroll" style="flex:0 0 auto"><div class="empty">读取显示器…</div></div>

  <div class="sec-label">屏幕电源 <span class="ver" id="pw-badge"></span></div>
  <div class="grid" id="power">
    <div class="cell" id="cell-offall"><span class="ico">🌙</span><span class="lbl">全部待机</span></div>
    <div class="cell" id="cell-wake"><span class="ico">☀️</span><span class="lbl">唤醒屏幕</span></div>
    <div class="cell" id="cell-link"><span class="ico">🔗</span><span class="lbl">联动：关</span></div>
  </div>
  <div class="hint" id="power-hint" style="padding:0 10px 6px"></div>

  <div class="sec-label">显示器健康 <span class="ver" id="health-badge"></span></div>
  <div class="grid" id="healthgrid">
    <div class="cell" id="cell-hrepair"><span class="ico">🩺</span><span class="lbl">一键修复</span></div>
    <div class="cell" id="cell-hdeep"><span class="ico">🛠️</span><span class="lbl">深度修复</span></div>
    <div class="cell" id="cell-hscan"><span class="ico">📋</span><span class="lbl">检查记录</span></div>
  </div>
  <div class="hint" id="health-hint" style="padding:0 10px 2px">正在读取链路记录…</div>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 10px 0">
    <span style="color:#a8b0bf;font-size:11.5px">自动修复 <span style="opacity:.7">（掉线自动重新协商）</span></span>
    <input type="checkbox" id="h-auto" style="width:15px;height:15px;cursor:pointer">
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 10px 6px">
    <span style="color:#a8b0bf;font-size:11.5px">掉线时弹提醒 <span style="opacity:.7">（右下角气泡）</span></span>
    <input type="checkbox" id="h-notify" style="width:15px;height:15px;cursor:pointer">
  </div>
  <div id="health-events" style="padding:0 10px 6px"></div>

  <div class="sec-label">联网增强 <span class="ver" id="adb-badge">可选</span></div>
  <div class="grid" id="adbgrid">
    <div class="cell" id="cell-adbscan"><span class="ico">🔍</span><span class="lbl">检测 ADB</span></div>
    <div class="cell" id="cell-adbdl"><span class="ico">⬇</span><span class="lbl">获取 ADB</span></div>
    <div class="cell" id="cell-adbconn"><span class="ico">🖥</span><span class="lbl">连接显示器</span></div>
  </div>
  <div class="hint" id="adb-hint">联网增强（方案B）：让电脑直接控制显示器本体（电源 / 音量 / 输入源 / 听懂遥控器）。需要显示器开启「ADB 调试」，完全可选——不开启也照样用上面全部本地功能。</div>

  <div class="sec-label">快捷控制</div>
  <div class="grid" id="quick">
    <div class="cell" id="cell-srgb" data-act="color-srgb"><span class="ico">🎨</span><span class="lbl">sRGB</span></div>
    <div class="cell" id="cell-p3" data-act="color-p3"><span class="ico">🌈</span><span class="lbl">P3</span></div>
    <div class="cell" id="cell-adobe" data-act="color-adobe"><span class="ico">🖼️</span><span class="lbl">AdobeRGB</span></div>
    <div class="cell" id="cell-align" data-act="align-mac"><span class="ico">🍎</span><span class="lbl">对齐Mac</span></div>
    <div class="cell" id="cell-ppi" data-act="ppi"><span class="ico">🪟</span><span class="lbl">窗口不变小</span></div>
    <div class="cell" id="cell-rotate" data-act="rotate"><span class="ico">🔄</span><span class="lbl">横竖屏</span></div>
    <div class="cell" id="cell-span" data-act="span"><span class="ico">🎬</span><span class="lbl">双屏铺满</span></div>
  </div>

  <div class="foot">
    <button class="fbtn" id="refresh-btn">⟳ 刷新</button>
    <button class="fbtn" id="main-btn2">🖥️ 主窗口</button>
    <button class="fbtn" id="autostart-btn">⚡ 自启：检测中</button>
  </div>
</div>

<script>
function invoke(cmd, args={}){ if(window.__TAURI__&&window.__TAURI__.core) return window.__TAURI__.core.invoke(cmd,args); return Promise.reject(new Error('NO_TAURI')); }
function flash(el){ el.classList.add('active'); setTimeout(()=>el.classList.remove('active'),300); }

// DDC 写入串行化 + 合并最新值：拖动滑块时最多只有 1 个后台进程在跑，
// 中间值被覆盖、最终值保证送达（此前每格都新起 powershell 进程，拖动即卡死）
const vpState = new Map();
function sendVCP(kind, id, val){
  const key = kind + ':' + id;
  let st = vpState.get(key);
  if (!st) { st = { latest: null, busy: false }; vpState.set(key, st); }
  st.latest = val;
  if (st.busy) return;
  st.busy = true;
  (async () => {
    while (st.latest !== null) {
      const v = st.latest; st.latest = null;
      const cmd = kind === 'brightness' ? 'set_brightness' : 'set_volume';
      try { await invoke(cmd, { displayId: id, value: Number(v) }); } catch (e) {}
    }
    st.busy = false;
  })();
}

async function load(){
  const box = document.getElementById('scroll');
  try {
    const ds = await invoke('get_displays');
    if(!ds||!ds.length){ box.innerHTML='<div class="empty">未检测到显示器</div>'; return; }
    box.innerHTML = ds.map(d=>{
      const hasBri = d.ddc || d.brightness != null; // DDC 或 WMI（内屏）亮度
      const badge = d.ddc ? '<span class="badge">DDC</span>' : (hasBri ? '<span class="badge">WMI</span>' : '<span class="badge" style="background:rgba(255,160,80,.12);color:#e8a75c;border-color:rgba(255,160,80,.3)">无DDC</span>');
      const briRow = hasBri ? '<div class="srow"><label>亮度</label><input type="range" min="0" max="100" value="'+(d.brightness??50)+'" data-id="'+d.id+'" data-k="brightness"><span class="val">'+(d.brightness??50)+'%</span></div>' : '';
      const volRow = d.ddc ? '<div class="srow"><label>音量</label><input type="range" min="0" max="100" value="'+(d.volume??50)+'" data-id="'+d.id+'" data-k="volume"><span class="val">'+(d.volume??50)+'%</span></div>' : '';
      // 单屏电源（仅 DDC 可用的屏）：走 DDC VCP 0xD6 单独待机/点亮
      const powerRow = d.ddc ? '<div class="srow"><label>电源</label><div style="display:flex;gap:6px"><button class="ibtn" data-pw="4" data-id="'+d.id+'">待机</button><button class="ibtn" data-pw="1" data-id="'+d.id+'">点亮</button></div><span class="val" data-pwval="'+d.id+'">—</span></div>' : '';
      let hint = '';
      if (hasBri && !d.ddc) hint = '<div class="hint">内屏：亮度走系统 WMI；喇叭/耳机音量用上方「系统音量」。</div>';
      else if (!hasBri && !d.ddc) hint = '<div class="hint">此屏不走 DDC/CI，无法单独控制；用上方「全部待机」可让它与其它屏一起待机</div>';
      return '<div class="grp open">'+
        '<div class="grp-h">'+
          '<div><div class="grp-title">'+(d.name||d.id)+'</div><div class="grp-meta">'+(d.resolution||'')+(d.hz?' · '+d.hz+'Hz':'')+(d.main?' · 主屏':'')+(d.color_profile?' · '+d.color_profile:'')+'</div></div>'+
          '<div class="grp-right">'+badge+'</div>'+
        '</div>'+
        '<div class="grp-body">'+briRow+volRow+powerRow+hint+'</div>'+
      '</div>';
    }).join('');
    box.querySelectorAll('input[type=range]').forEach(sl=>{
      sl.addEventListener('input', ev=>{ const v=ev.target.value; sl.parentElement.querySelector('.val').textContent=v+'%'; sendVCP(sl.dataset.k, sl.dataset.id, v); });
    });
    // 单屏电源按钮（DDC VCP 0xD6）
    box.querySelectorAll('button[data-pw]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.id, mode = Number(b.dataset.pw);
        const valEl = box.querySelector('[data-pwval="'+id+'"]');
        if (valEl) valEl.textContent = '…';
        try {
          await invoke('set_display_power', { displayId: id, mode: mode });
          // 点亮后 DDC 通道需 2~5 秒才恢复响应（实测），延迟回读避免读到瞬态
          const wait = mode === 1 ? 4000 : 1200;
          setTimeout(async ()=>{
            try {
              const m = await invoke('get_display_power', { displayId: id });
              if (valEl) valEl.textContent = ({1:'开',2:'待机',4:'软关',5:'硬关'}[m] || String(m));
            } catch(e){ if (valEl) valEl.textContent = '?'; }
          }, wait);
        } catch(e){ if (valEl) valEl.textContent = '失败'; }
      };
    });
  } catch(e){ box.innerHTML='<div class="empty">无法读取显示器：请确认显示器已连接，并检查依赖是否就绪</div>'; }
}

document.getElementById('quick').querySelectorAll('.cell').forEach(c=>{
  c.onclick = async ()=>{ flash(c); const a=c.dataset.act; try{ switch(a){
    case 'color-srgb': await invoke('apply_color_space',{space:'sRGB'}); break;
    case 'color-p3': await invoke('apply_color_space',{space:'p3'}); break;
    case 'color-adobe': await invoke('apply_color_space',{space:'adobeRGB'}); break;
    case 'align-mac': await invoke('match_mac'); break;
    case 'ppi': await invoke('match_ppi'); break;
    case 'rotate': await invoke('rotate_secondary'); break;
    case 'span': await invoke('span_video'); break;
  }}catch(e){ c.style.borderColor='#ef6a6a'; setTimeout(()=>{c.style.borderColor='';},700); } };
});
document.getElementById('refresh-btn').onclick=load;
document.getElementById('main-btn').onclick=()=>invoke('open_main');
document.getElementById('main-btn2').onclick=()=>invoke('open_main');
document.getElementById('quit-btn').onclick=()=>invoke('quit_app');
// 面板独立关闭：只隐藏浮窗，不退出应用（此前只有「退出」，一点就杀掉整个程序）
document.getElementById('hide-btn').onclick=()=>invoke('hide_panel');
document.addEventListener('keydown', e=>{ if(e.key==='Escape') invoke('hide_panel'); });

// 版本号 + 开机自启开关
const autostartBtn = document.getElementById('autostart-btn');
function paintAutostart(on){
  autostartBtn.textContent = on ? '⚡ 自启：开' : '⚡ 自启：关';
  autostartBtn.style.color = on ? '#7fb0ff' : '';
}
async function refreshAutostart(){
  try { paintAutostart(await invoke('get_autostart')); }
  catch(e){ autostartBtn.textContent='⚡ 自启：?'; }
}
autostartBtn.onclick = async ()=>{
  const want = !(autostartBtn.textContent.includes('开'));
  autostartBtn.textContent = '⚡ 设置中…';
  try {
    await invoke('set_autostart', { enabled: want });
    paintAutostart(want);
  } catch(e){
    autostartBtn.textContent = '⚡ 失败';
    autostartBtn.style.color = '#ef6a6a';
    setTimeout(()=>{ refreshAutostart(); autostartBtn.style.color=''; }, 900);
  }
};
// 注意：这是经典脚本(type 未标 module)，不能用顶层 await——否则整段脚本语法报错、
// 面板全部功能失效（刷新/自启/快捷操作/滑块都点不动）。
// 系统音量（Windows 才显示）：拖动串行化，与主窗口同一策略
const sysVol = { latest: null, busy: false };
function sendSysVol(val){
  sysVol.latest = val;
  if (sysVol.busy) return;
  sysVol.busy = true;
  (async () => {
    while (sysVol.latest !== null) {
      const v = sysVol.latest; sysVol.latest = null;
      try { await invoke('set_system_volume', { value: Number(v) }); } catch(e){}
    }
    sysVol.busy = false;
  })();
}
async function loadAudio(){
  try {
    const p = await invoke('get_platform');
    if (p !== 'windows') return;
    const a = await invoke('get_system_audio');
    document.getElementById('audio-sec').style.display = '';
    document.getElementById('audio-grp').style.display = '';
    const sl = document.getElementById('sys-vol');
    sl.disabled = !a.adjustable;
    sl.value = a.volume;
    document.getElementById('sys-vol-val').textContent = a.volume + '%';
    let txt = a.name || '默认输出设备';
    if (!a.adjustable) txt += '｜固定音量端点：显示器喇叭请用对应屏的 DDC 音量滑块';
    document.getElementById('audio-dev').textContent = txt;
    sl.addEventListener('input', ev=>{
      document.getElementById('sys-vol-val').textContent = ev.target.value + '%';
      sendSysVol(ev.target.value);
    });
  } catch(e){ /* 预览模式静默 */ }
}

// 电池设备（Windows：Battery 设备类枚举）
function battIcon(conn){
  if (conn === '内置') return '💻';
  if (conn === '蓝牙') return '🎧';
  if (conn === 'USB/无线' || conn === 'USB') return '🖱️';
  return '🔋';
}
async function loadBatteries(){
  try {
    const p = await invoke('get_platform');
    if (p !== 'windows') return;
    const list = await invoke('get_batteries');
    document.getElementById('batt-sec').style.display = '';
    const box = document.getElementById('batt-box');
    if (!list || !list.length) {
      box.innerHTML = '<div style="padding:0 8px"><div class="empty">未检测到带电池的设备</div></div>';
      return;
    }
    box.innerHTML = list.map(b=>{
      const pct = b.percent >= 0 ? b.percent : null;
      let state = '读取不到', stateCls = '';
      if (pct != null) {
        if (b.charging) { state = '充电中'; stateCls = 'background:rgba(52,201,142,.15);color:#34c98e;border-color:rgba(52,201,142,.3)'; }
        else if (b.on_ac) { state = '已接通电源'; stateCls = 'background:rgba(79,140,255,.15);color:#7fb0ff;border-color:rgba(79,140,255,.3)'; }
        else { state = '放电中'; stateCls = 'background:rgba(168,176,191,.14);color:#a8b0bf;border-color:rgba(168,176,191,.25)'; }
      }
      const pctTxt = pct == null ? '—' : pct + '%';
      const barW = pct == null ? 0 : pct;
      const barColor = pct == null ? 'transparent' : (b.charging ? '#34c98e' : (pct <= 20 ? '#ef6a6a' : '#4f8cff'));
      return '<div class="grp open" style="margin:4px 8px">'+
        '<div class="grp-h">'+
          '<div><div class="grp-title">'+battIcon(b.conn)+' '+(b.name||'电池设备')+'</div><div class="grp-meta">'+ (b.conn||'其它') +'</div></div>'+
          '<div class="grp-right"><span class="badge" style="'+stateCls+'">'+state+'</span></div>'+
        '</div>'+
        '<div class="grp-body">'+
          '<div class="srow"><label>电量</label><div style="height:5px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden"><div style="height:100%;width:'+barW+'%;background:'+barColor+';border-radius:5px"></div></div><span class="val">'+pctTxt+'</span></div>'+
        '</div>'+
      '</div>';
    }).join('');
  } catch(e){ /* 预览模式静默 */ }
}

invoke('get_version')
  .then(v => { document.getElementById('pver').textContent = 'v' + v; })
  .catch(() => { /* 预览模式静默 */ });

// ============ 屏幕电源（方案A：纯本地，不依赖网络） ============
// 「全部待机」走 Windows 系统级指令：一次让全部屏待机，含不走 DDC 的屏（本机小米）。
// 「唤醒」合成输入事件；「联动」轮询在线显示器快照，主控屏离线→其余屏跟着 DDC 待机。
const pwHintEl = document.getElementById('power-hint');
function pwHint(t, err){ pwHintEl.textContent = t || ''; pwHintEl.style.color = err ? '#ef6a6a' : ''; }

document.getElementById('cell-wake').onclick = async (ev)=>{

// 联动状态机：只对支持 DDC 的屏下发动作（无 DDC 的屏由「全部待机」覆盖）
const link = { on:false, timer:null, last:null, pend:null, pendCount:0, until:0, ddcIds:[] };
function paintLink(){
  const el = document.getElementById('cell-link');
  el.classList.toggle('active', link.on);
  el.querySelector('.lbl').textContent = link.on ? '联动：开' : '联动：关';
}
async function linkTick(){
  if (!link.on) return;
  try {
    const snap = await invoke('display_snapshot');
    if (!Array.isArray(snap) || !snap.length) return;
    if (link.last === null) { link.last = snap.slice(); return; }
    const gone = link.last.filter(x => !snap.includes(x));
    const back = snap.filter(x => !link.last.includes(x));
    if (!gone.length && !back.length) {
      link.pend = null; link.pendCount = 0;    // 状态稳定，清掉等待确认的中间态
      return;
    }
    // 防抖：同一状态连续 2 次采样才动作（切换输入源/重连瞬间会有抖动）。
    // 关键：这里**不能**提前更新 link.last——否则下一次采样就看不到变化，
    // 永远凑不满 2 次确认，联动会彻底不触发（实测踩过）。
    const sig = snap.join(',');
    if (link.pend === sig) {
      link.pendCount++;
    } else {
      link.pend = sig;
      link.pendCount = 1;
      return;                                  // 第一次见到该状态，先观察
    }
    if (link.pendCount !== 2) return;
    link.last = snap.slice();                  // 连续两次确认后才更新基线
    link.pend = null; link.pendCount = 0;
    if (Date.now() < link.until) return;      // 冷却：动作后 15 秒内不重复触发
    const others = snap.filter(id => link.ddcIds.includes(id));
    const mode = gone.length ? 4 : 1;         // 有屏离线→其余待机；有屏回来→其余点亮
    if (!others.length) return;
    link.until = Date.now() + 15000;
    pwHint((mode === 4 ? '检测到显示器离线 → 其余屏跟着待机…' : '检测到显示器回来 → 其余屏跟着点亮…'));
    for (const id of others) { try { await invoke('set_display_power', { displayId: id, mode: mode }); } catch(e){} }
    pwHint('已联动' + (mode === 4 ? '待机' : '点亮') + ' ' + others.length + ' 台（DDC）');
  } catch(e){ /* 静默 */ }
}
document.getElementById('cell-link').onclick = async (ev)=>{
  flash(ev.currentTarget);
  link.on = !link.on;
  paintLink();
  if (link.on) {
    link.last = null; link.pend = null; link.pendCount = 0; link.until = 0;
    try { const ds = await invoke('get_displays'); link.ddcIds = (ds||[]).filter(d=>d.ddc).map(d=>d.id); } catch(e){ link.ddcIds = []; }
    link.timer = setInterval(linkTick, 2500);
    pwHint('联动已开（每 2.5 秒检测）：屏离线→其余屏跟着待机／回来→跟着点亮。⚠️ 只有真正从系统里消失的屏（拔线／断电）才检测得到；智能显示器用遥控关机一般不改变接口信号，检测不到');
  } else {
    if (link.timer) clearInterval(link.timer);
    link.timer = null;
    pwHint('联动已关');
  }
};

  }else if(p==='macos'){

  }
  if(p==='linux'){
    ['cell-srgb','cell-p3','cell-adobe','cell-align','cell-ppi','cell-rotate'].forEach(id=>{

    });

// ============ 联网增强（方案B：ADB 精细控制，完全可选） ============
// 有 ADB → 电脑能直接管显示器本体（电源 / 音量 / 输入源 / 听得懂遥控器）；
// 没有 ADB → 上面方案A 的本地能力照常，互不影响。
const adbHintEl = document.getElementById('adb-hint');
function adbSay(t, err){ adbHintEl.textContent = t || ''; adbHintEl.style.color = err ? '#ef6a6a' : ''; }

// 检测：adb 是否存在 + 已连接哪些设备
document.getElementById('cell-adbscan').onclick = async (ev)=>{
  flash(ev.currentTarget);
  adbSay('正在检测 ADB 环境…');
  try {
    const st = await invoke('adb_status');
    document.getElementById('adb-badge').textContent = st.available ? '就绪' : '未就绪';
    const devs = (st.devices || []).filter(Boolean);
    if (st.available) {
      adbSay('adb 已就绪：' + st.path + (devs.length ? ('｜已连接：' + devs.join('、')) : '｜尚未连接显示器（点「连接显示器」）'));
    } else {
      adbSay('未找到 adb。点「获取 ADB」自动下载，或手动把 platform-tools 放到 %LOCALAPPDATA%\\screenguard_adb\\。方案A 本地功能不受影响。');
    }
  } catch(e){ adbSay('检测失败：' + (e && e.message ? e.message : e), true); }
};

// 获取 ADB：自动下载 Android Platform Tools 并解压
document.getElementById('cell-adbdl').onclick = async (ev)=>{
  flash(ev.currentTarget);
  adbSay('正在下载 Android Platform Tools（约 5MB，慢的话请等一会）…');
  try {
    const p = await invoke('adb_download');
    adbSay('已就绪：' + p);
    document.getElementById('adb-badge').textContent = '就绪';
  } catch(e){
    adbSay('自动下载失败：' + (e && e.message ? e.message : e) + '（可手动下载 platform-tools 解压到 %LOCALAPPDATA%\\screenguard_adb\\；装了 Android 模拟器或投屏工具的话，它们自带的 adb 也会被自动识别）', true);
  }
};

// 连接显示器：填显示器在局域网里的地址（在显示器「设置 → 网络 / ADB 调试」里看）
document.getElementById('cell-adbconn').onclick = async (ev)=>{
  flash(ev.currentTarget);
  const last = localStorage.getItem('sg_adb_addr') || '';
  const ip = window.prompt('输入显示器在局域网中的地址（显示器「设置 → 网络」里可查），例如 192.168.31.50:5555', last);
  if (!ip || !ip.trim()) return;
  localStorage.setItem('sg_adb_addr', ip.trim());
  adbSay('正在连接 ' + ip.trim() + ' …');
  try {
    const out = await invoke('adb_connect', { addr: ip.trim() });
    adbSay('连接结果：' + out);
  } catch(e){ adbSay('连接失败：' + (e && e.message ? e.message : e), true); }
};

// ============ 显示器健康（KVM 切换 / EDID 重新协商异常的记录与修复） ============
// 背景：本机链路是「电脑 --USB-C→DP/HDMI-- KVM --DP/HDMI-- 两块屏」，KVM 切换、
// 显示器开关、电脑重启时会重新协商 EDID，协商失败表现为黑屏不恢复 / 抖动花屏 /
// 清晰度变差、画面发白发亮（色彩格式被降级）。这些是显示配置状态错了，重置即可恢复。
const hHintEl = document.getElementById('health-hint');
function hSay(t, err){ hHintEl.textContent = t || ''; hHintEl.style.color = err ? '#ef6a6a' : ''; }
const hEvtBox = document.getElementById('health-events');
let hEvts = [];

function hPaintEvents(){
  const n = hEvts.length;
  const badge = document.getElementById('health-badge');
  const disc = hEvts.filter(x => x.id === '1010').length;   // 1010 = 设备被突然移除
  const tdr = hEvts.filter(x => x.id === '4101').length;    // 4101 = 显示驱动重置
  badge.textContent = n ? (n + ' 条') : '正常';
  if (!n) {
    hEvtBox.innerHTML = '<div class="hint" style="padding:0">近 24 小时未检测到显示器链路异常 👍</div>';
  } else {
    hEvtBox.innerHTML = hEvts.slice(0, 8).map(e=>{
      const color = (e.lvl === '错误' || e.lvl === '严重') ? '#ef6a6a' : (e.lvl === '警告' ? '#e8a75c' : '#a8b0bf');
      const m = (e.msg || '').replace(/Display|display/g, '屏');
      return '<div class="hint" style="padding:2px 0;color:'+color+'">'+e.t+' · '+e.lvl+' · #'+e.id+' · '+m.slice(0,68)+'</div>';
    }).join('') + (n > 8 ? '<div class="hint" style="padding:2px 0">…共 '+n+' 条</div>' : '');
  }
  let s = '近 24 小时 ' + n + ' 条链路事件';
  if (disc) s += '，其中 ' + disc + ' 次显示器突然离线';
  if (tdr) s += '，' + tdr + ' 次显示驱动重置';
  if (disc || tdr) s += '　→ 建议试「一键修复」';
  hSay(n ? s : '近 24 小时链路正常，没有异常记录 👍');
}

async function hLoadEvents(){
  try {
    const raw = await invoke('health_events', { minutes: 1440 });
    hEvts = [];
    if (raw) {
      for (const line of raw.split('\n')) {
        const p = line.split('|');
        if (p[0] === 'E' && p.length >= 6) hEvts.push({ t: p[1], lvl: p[2], prov: p[3], id: p[4], msg: p.slice(5).join('|') });
      }
    }
    hPaintEvents();
  } catch(e){ hSay('读取链路记录失败：' + (e && e.message ? e.message : e), true); }
}

async function hRepair(level){
  hSay(level >= 2 ? '深度修复中：强制重新协商 + 链路重握手（屏幕会黑一下再回来，约 5 秒）…'
                  : '修复中：重新协商显示配置（屏幕可能短暂闪一下）…');
  try {
    const r = await invoke('repair_display', { level: level });
    const brief = String(r || '').split('\n').map(x => x.replace(/\|/g, ' → ')).join('；');
    hSay('修复完成：' + brief);
    setTimeout(hLoadEvents, 1500);
  } catch(e){ hSay('修复失败：' + (e && e.message ? e.message : e), true); }
}

document.getElementById('cell-hrepair').onclick = (ev)=>{ flash(ev.currentTarget); hRepair(1); };
document.getElementById('cell-hdeep').onclick   = (ev)=>{ flash(ev.currentTarget); hRepair(2); };
document.getElementById('cell-hscan').onclick   = async (ev)=>{ flash(ev.currentTarget); hSay('正在读取链路记录…'); await hLoadEvents(); };

setTimeout(hLoadEvents, 1200);
setInterval(hLoadEvents, 60000);   // 每分钟刷新一次链路记录

// 自动修复 / 掉线提醒 两个开关（存在 %APPDATA%\Screenguard\health.json）
async function hLoadCfg(){
  try {
    const c = await invoke('health_get_config');
    document.getElementById('h-auto').checked = !!c.auto_repair;
    document.getElementById('h-notify').checked = !!c.notify;
  } catch(e){ /* 预览模式静默 */ }
}
async function hSaveCfg(){
  try {
    await invoke('health_set_config', {
      autoRepair: document.getElementById('h-auto').checked,
      notify: document.getElementById('h-notify').checked
    });
  } catch(e){ hSay('保存设置失败：' + (e && e.message ? e.message : e), true); }
}
document.getElementById('h-auto').onchange = (ev)=>{
  hSaveCfg();
  hSay(ev.target.checked
    ? '自动修复已开：检测到显示器掉线且 6 秒后仍没恢复，会自动重新协商显示配置'
    : '自动修复已关');
};
document.getElementById('h-notify').onchange = (ev)=>{
  hSaveCfg();
  hSay(ev.target.checked ? '掉线提醒已开：出现链路掉线会在右下角弹提示' : '掉线提醒已关');
};
hLoadCfg();

// 调试/自动化钩子：允许从外部（CDP）驱动联动状态机做验证，也方便排查"为什么没触发/误触发"
window.__sg = {
  link: link,
  linkTick: linkTick,
  paintLink: paintLink,
  snapshot: () => invoke('display_snapshot'),
  healthEvents: hLoadEvents,
  repair: hRepair
};
</script>
